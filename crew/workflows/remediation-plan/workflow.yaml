name: remediation-plan
description: "Build the prioritized remediation roadmap: findings prioritization, multi-phase roadmap, effort estimation, and quick wins identification. Produces the remediation plan deliverable."

# ─── Steps ──────────────────────────────────────────────────────────────────────

steps:
  - id: step-01-prioritization
    file: steps/step-01-prioritization.md
    agent: consultant
    prerequisites: []
    gate_after: gate-prioritization
    required_artifacts:
      - pattern: "{{assessment_artifacts}}/{{engagement_name}}-findings-register.md"
      - pattern: "{{assessment_artifacts}}/compliance-matrix.md"
    produces: []

  - id: step-02-roadmap
    file: steps/step-02-roadmap.md
    agent: consultant
    prerequisites: [step-01-prioritization]
    required_artifacts:
      - pattern: "{{assessment_artifacts}}/{{engagement_name}}-environment-profile.md"
    produces:
      - pattern: "{{deliverables}}/{{engagement_name}}-remediation-roadmap.md"
        type: remediation-roadmap

  - id: step-03-effort-estimation
    file: steps/step-03-effort-estimation.md
    agent: pm
    prerequisites: [step-02-roadmap]
    required_artifacts:
      - pattern: "{{deliverables}}/{{engagement_name}}-remediation-roadmap.md"
    produces:
      - pattern: "{{deliverables}}/{{engagement_name}}-remediation-roadmap.md"
        type: remediation-roadmap
        note: "Updates the roadmap with effort estimates"

  - id: step-04-quick-wins
    file: steps/step-04-quick-wins.md
    agent: consultant
    prerequisites: [step-03-effort-estimation]
    required_artifacts:
      - pattern: "{{deliverables}}/{{engagement_name}}-remediation-roadmap.md"
    produces:
      - pattern: "{{deliverables}}/{{engagement_name}}-remediation-roadmap.md"
        type: remediation-roadmap
        note: "Finalizes roadmap with quick wins section"

# ─── Gates ──────────────────────────────────────────────────────────────────────

gates:
  - id: gate-prioritization
    after_step: step-01-prioritization
    blocks: [step-02-roadmap]
    description: "Prioritization rationale must be reviewed before building the phased roadmap"
    notes: "Client constraints (budget, resources, regulatory deadlines) should be confirmed at this gate"

# ─── References ─────────────────────────────────────────────────────────────────

templates:
  roadmap_template: "crew/templates/remediation-roadmap-template.md"

input_file_patterns:
  findings_register:
    description: "Validated findings register (source of all remediation items)"
    pattern: "{{assessment_artifacts}}/{{engagement_name}}-findings-register.md"
  compliance_matrix:
    description: "Compliance mapping to inform regulatory prioritization"
    pattern: "{{assessment_artifacts}}/compliance-matrix.md"
  environment_profile:
    description: "Environment profile for feasibility context"
    pattern: "{{assessment_artifacts}}/{{engagement_name}}-environment-profile.md"
