name: report-generation
description: "Assemble the full client assessment report: executive summary, technical findings, compliance matrix, and final QA review. Requires a completed, QA-approved findings register as input."

# ─── Steps ──────────────────────────────────────────────────────────────────────

steps:
  - id: step-01-executive-summary
    file: steps/step-01-executive-summary.md
    agent: writer
    prerequisites: []
    gate_after: gate-executive-summary
    required_artifacts:
      - pattern: "{{assessment_artifacts}}/{{engagement_name}}-findings-register.md"
      - pattern: "{{assessment_artifacts}}/{{engagement_name}}-environment-profile.md"
    produces:
      - pattern: "{{deliverables}}/{{engagement_name}}-executive-summary.md"
        type: executive-summary

  - id: step-02-technical-report
    file: steps/step-02-technical-report.md
    agent: writer
    prerequisites: [step-01-executive-summary]
    required_artifacts:
      - pattern: "{{assessment_artifacts}}/{{engagement_name}}-findings-register.md"
      - pattern: "{{assessment_artifacts}}/compliance-matrix.md"
    produces:
      - pattern: "{{deliverables}}/{{engagement_name}}-technical-report.md"
        type: technical-report

  - id: step-03-findings-matrix
    file: steps/step-03-findings-matrix.md
    agent: writer
    prerequisites: [step-02-technical-report]
    required_artifacts:
      - pattern: "{{assessment_artifacts}}/{{engagement_name}}-findings-register.md"
    produces:
      - pattern: "{{deliverables}}/{{engagement_name}}-findings-matrix.md"
        type: findings-matrix

  - id: step-04-assemble
    file: steps/step-04-assemble.md
    agent: writer
    prerequisites: [step-03-findings-matrix]
    required_artifacts:
      - pattern: "{{deliverables}}/{{engagement_name}}-executive-summary.md"
      - pattern: "{{deliverables}}/{{engagement_name}}-technical-report.md"
      - pattern: "{{deliverables}}/{{engagement_name}}-findings-matrix.md"
    produces:
      - pattern: "{{deliverables}}/{{engagement_name}}-assessment-report.md"
        type: assessment-report

  - id: step-05-qa-review
    file: steps/step-05-qa-review.md
    agent: reviewer
    prerequisites: [step-04-assemble]
    gate_after: gate-qa-review
    required_artifacts:
      - pattern: "{{deliverables}}/{{engagement_name}}-assessment-report.md"
    produces: []

# ─── Gates ──────────────────────────────────────────────────────────────────────

gates:
  - id: gate-executive-summary
    after_step: step-01-executive-summary
    blocks: [step-02-technical-report]
    description: "Executive summary must be reviewed by engagement lead before technical report drafting continues"

  - id: gate-qa-review
    after_step: step-05-qa-review
    blocks: []
    description: "QA reviewer must explicitly PASS the full report before client delivery"
    required_approvers: [qa-reviewer]
    blocking: true

# ─── References ─────────────────────────────────────────────────────────────────

templates:
  exec_summary_template: "crew/templates/executive-summary-template.md"
  technical_report_template: "crew/templates/technical-report-template.md"
  findings_matrix_template: "crew/templates/findings-matrix-template.md"

input_file_patterns:
  findings_register:
    description: "Validated findings register from assessment phase"
    pattern: "{{assessment_artifacts}}/{{engagement_name}}-findings-register.md"
  compliance_matrix:
    description: "Compliance mapping matrix"
    pattern: "{{assessment_artifacts}}/compliance-matrix.md"
  environment_profile:
    description: "Environment profile for context"
    pattern: "{{assessment_artifacts}}/{{engagement_name}}-environment-profile.md"
  sow:
    description: "SOW for scope alignment validation"
    pattern: "{{engagement_artifacts}}/*-sow.md"
