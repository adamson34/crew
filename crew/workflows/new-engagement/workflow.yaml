name: new-engagement
description: "End-to-end workflow for a net-new consulting engagement. Two entry paths: Path A for engagements with a signed proposal already in hand, Path B for vague or unscoped projects that need a SOW, LOE, and Assumptions document built first. Both paths converge at PM breakdown and flow through consultant execution, technical report writing, and final QA."

# ─── Steps ──────────────────────────────────────────────────────────────────────
# Path A and Path B diverge after entry and converge at step-03-pm-breakdown.
# Steps with a `path` field only apply when that path is active.
# Steps with `prerequisites_any` require at least ONE of the listed steps (convergence point).

steps:
  - id: step-00-entry
    file: steps/step-00-entry.md
    agent: bd
    prerequisites: []
    required_artifacts: []
    produces: []
    note: "Determines whether this is Path A (signed proposal) or Path B (unscoped project)"

  # ── Path A: Proposal-First ──────────────────────────────────────────────────

  - id: step-01a-proposal-intake
    file: steps/step-01a-proposal-intake.md
    agent: bd
    path: A
    prerequisites: [step-00-entry]
    required_artifacts:
      - pattern: "{{engagement_artifacts}}/*-proposal.{md,pdf,docx}"
    produces: []

  - id: step-02a-sow-derivation
    file: steps/step-02a-sow-derivation.md
    agent: bd
    path: A
    prerequisites: [step-01a-proposal-intake]
    gate_after: gate-sow-derivation
    required_artifacts: []
    produces:
      - pattern: "{{engagement_artifacts}}/{{engagement_name}}-sow.md"
        type: sow

  # ── Path B: Scoping-First ───────────────────────────────────────────────────

  - id: step-01b-project-brief
    file: steps/step-01b-project-brief.md
    agent: bd
    path: B
    prerequisites: [step-00-entry]
    required_artifacts: []
    produces: []

  - id: step-02b-scope-definition
    file: steps/step-02b-scope-definition.md
    agent: bd
    path: B
    prerequisites: [step-01b-project-brief]
    gate_after: gate-scope-definition
    required_artifacts: []
    produces:
      - pattern: "{{engagement_artifacts}}/{{engagement_name}}-sow.md"
        type: sow
      - pattern: "{{engagement_artifacts}}/{{engagement_name}}-loe.md"
        type: loe
      - pattern: "{{engagement_artifacts}}/{{engagement_name}}-assumptions.md"
        type: assumptions

  # ── LOE generation (Path A only — Path B produces LOE during scope definition)

  - id: step-02c-loe-generation
    file: steps/step-02c-loe-generation.md
    agent: pm
    path: A
    prerequisites: [step-02a-sow-derivation]
    required_artifacts:
      - pattern: "{{engagement_artifacts}}/{{engagement_name}}-sow.md"
    produces:
      - pattern: "{{engagement_artifacts}}/{{engagement_name}}-loe.md"
        type: loe
      - pattern: "{{engagement_artifacts}}/{{engagement_name}}-assumptions.md"
        type: assumptions

  # ── Convergence: Both paths merge here ──────────────────────────────────────

  - id: step-03-pm-breakdown
    file: steps/step-03-pm-breakdown.md
    agent: pm
    prerequisites_any: [step-02c-loe-generation, step-02b-scope-definition]
    gate_after: gate-pm-breakdown
    required_artifacts:
      - pattern: "{{engagement_artifacts}}/{{engagement_name}}-sow.md"
      - pattern: "{{engagement_artifacts}}/{{engagement_name}}-loe.md"
    produces:
      - pattern: "{{engagement_artifacts}}/{{engagement_name}}-task-assignment.md"
        type: task-assignment

  - id: step-04-consultant-execution
    file: steps/step-04-consultant-execution.md
    agent: consultant
    prerequisites: [step-03-pm-breakdown]
    gate_after: gate-consultant-execution
    required_artifacts:
      - pattern: "{{engagement_artifacts}}/{{engagement_name}}-task-assignment.md"
    produces:
      - pattern: "{{assessment_artifacts}}/{{engagement_name}}-findings-register.md"
        type: findings-register
      - pattern: "{{assessment_artifacts}}/{{engagement_name}}-environment-profile.md"
        type: environment-profile
      - pattern: "{{assessment_artifacts}}/{{engagement_name}}-gap-analysis.md"
        type: gap-analysis

  - id: step-05-report-writing
    file: steps/step-05-report-writing.md
    agent: writer
    prerequisites: [step-04-consultant-execution]
    gate_after: gate-report-writing
    required_artifacts:
      - pattern: "{{assessment_artifacts}}/{{engagement_name}}-findings-register.md"
    produces:
      - pattern: "{{deliverables}}/{{engagement_name}}-technical-report.md"
        type: technical-report
      - pattern: "{{deliverables}}/{{engagement_name}}-findings-matrix.md"
        type: findings-matrix
      - pattern: "{{deliverables}}/{{engagement_name}}-executive-summary.md"
        type: executive-summary

  - id: step-06-qa-review
    file: steps/step-06-qa-review.md
    agent: reviewer
    prerequisites: [step-05-report-writing]
    gate_after: gate-qa-review
    required_artifacts:
      - pattern: "{{deliverables}}/{{engagement_name}}-technical-report.md"
      - pattern: "{{deliverables}}/{{engagement_name}}-executive-summary.md"
    produces:
      - pattern: "{{deliverables}}/{{engagement_name}}-assessment-report.md"
        type: assessment-report

  - id: step-06-import-history
    file: steps/step-06-import-history.md
    agent: pm
    prerequisites: [step-04-consultant-execution]
    required_artifacts: []
    produces: []
    optional: true
    note: "Import engagement cost data for LOE benchmarking. Can run anytime after execution."

# ─── Gates ──────────────────────────────────────────────────────────────────────

gates:
  - id: gate-sow-derivation
    after_step: step-02a-sow-derivation
    blocks: [step-02c-loe-generation]
    path: A
    description: "SOW derived from proposal must be reviewed before LOE generation. Confirm scope boundaries, deliverables, and assumptions accurately reflect the signed proposal."

  - id: gate-scope-definition
    after_step: step-02b-scope-definition
    blocks: [step-03-pm-breakdown]
    path: B
    description: "SOW + LOE + Assumptions must be reviewed before handing off to PM. Confirm scope is realistic, LOE is defensible, and assumptions are explicitly documented."

  - id: gate-pm-breakdown
    after_step: step-03-pm-breakdown
    blocks: [step-04-consultant-execution]
    description: "Task assignment and WBS must be reviewed before consultant begins execution. Confirm tasks are correctly scoped, sequenced, and assigned."

  - id: gate-consultant-execution
    after_step: step-04-consultant-execution
    blocks: [step-05-report-writing]
    description: "Findings register must be reviewed by engagement lead before passing to report writer. Confirm all findings are evidence-backed, accurately rated, and within scope."

  - id: gate-report-writing
    after_step: step-05-report-writing
    blocks: [step-06-qa-review]
    description: "Executive summary and technical report draft must be reviewed before final assembly."

  - id: gate-qa-review
    after_step: step-06-qa-review
    blocks: []
    description: "QA reviewer must explicitly PASS the full deliverable package before client delivery."
    required_approvers: [qa-reviewer]
    blocking: true

# ─── References ─────────────────────────────────────────────────────────────────

templates:
  sow_template: "crew/templates/sow-template.md"
  loe_template: "crew/templates/loe-template.md"
  assumptions_template: "crew/templates/assumptions-template.md"
  task_assignment_template: "crew/templates/task-assignment-template.md"
  technical_report_template: "crew/templates/technical-report-template.md"
  findings_matrix_template: "crew/templates/findings-matrix-template.md"

knowledge_base:
  ot_ics_overview: "crew/knowledge-base/ot-ics-overview.md"

data:
  severity_scales: "crew/data/severity-scales.yaml"
  standards_crosswalks: "crew/data/standards-crosswalks.yaml"

input_file_patterns:
  signed_proposal:
    description: "Signed client proposal (Path A only)"
    pattern: "{{engagement_artifacts}}/*-proposal.{md,pdf,docx}"
    path: A
  sow:
    description: "Approved Statement of Work (available after step-02a or step-02b)"
    pattern: "{{engagement_artifacts}}/{{engagement_name}}-sow.md"
  task_assignment:
    description: "PM task assignment (available after step-03)"
    pattern: "{{engagement_artifacts}}/{{engagement_name}}-task-assignment.md"
  findings_register:
    description: "Consultant findings register (available after step-04)"
    pattern: "{{assessment_artifacts}}/{{engagement_name}}-findings-register.md"
