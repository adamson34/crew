name: assessment
description: "Execute the full cybersecurity assessment lifecycle: environment profiling, framework selection, gap analysis, findings classification, compliance mapping, and QA review. This is the core technical workflow for CREW engagements."

# ─── Steps ──────────────────────────────────────────────────────────────────────

steps:
  - id: step-01-environment-profiling
    file: steps/step-01-environment-profiling.md
    agent: consultant
    prerequisites: []
    required_artifacts: []
    produces:
      - pattern: "{{assessment_artifacts}}/{{engagement_name}}-environment-profile.md"
        type: environment-profile

  - id: step-02-framework-selection
    file: steps/step-02-framework-selection.md
    agent: compliance
    prerequisites: [step-01-environment-profiling]
    required_artifacts:
      - pattern: "{{assessment_artifacts}}/{{engagement_name}}-environment-profile.md"
    produces:
      - pattern: "{{assessment_artifacts}}/{{engagement_name}}-framework-selection.md"
        type: framework-selection

  - id: step-03-gap-analysis
    file: steps/step-03-gap-analysis.md
    agent: consultant
    prerequisites: [step-02-framework-selection]
    required_artifacts:
      - pattern: "{{assessment_artifacts}}/{{engagement_name}}-environment-profile.md"
      - pattern: "{{assessment_artifacts}}/{{engagement_name}}-framework-selection.md"
    produces:
      - pattern: "{{assessment_artifacts}}/{{engagement_name}}-gap-analysis.md"
        type: gap-analysis

  - id: step-04-findings-classification
    file: steps/step-04-findings-classification.md
    agent: consultant
    prerequisites: [step-03-gap-analysis]
    gate_after: gate-findings-classification
    required_artifacts:
      - pattern: "{{assessment_artifacts}}/{{engagement_name}}-gap-analysis.md"
    produces:
      - pattern: "{{assessment_artifacts}}/{{engagement_name}}-findings-register.md"
        type: findings-register

  - id: step-05-compliance-mapping
    file: steps/step-05-compliance-mapping.md
    agent: compliance
    prerequisites: [step-04-findings-classification]
    required_artifacts:
      - pattern: "{{assessment_artifacts}}/{{engagement_name}}-findings-register.md"
    produces:
      - pattern: "{{assessment_artifacts}}/{{engagement_name}}-compliance-matrix.md"
        type: compliance-matrix

  - id: step-06-qa-review
    file: steps/step-06-qa-review.md
    agent: reviewer
    prerequisites: [step-05-compliance-mapping]
    gate_after: gate-qa-review
    required_artifacts:
      - pattern: "{{assessment_artifacts}}/{{engagement_name}}-findings-register.md"
      - pattern: "{{assessment_artifacts}}/{{engagement_name}}-compliance-matrix.md"
    produces: []

# ─── Gates ──────────────────────────────────────────────────────────────────────

gates:
  - id: gate-findings-classification
    after_step: step-04-findings-classification
    blocks: [step-05-compliance-mapping]
    description: "Findings register must be reviewed and approved by engagement lead before compliance mapping"
    required_approvers: [lead-consultant, engagement-pm]

  - id: gate-qa-review
    after_step: step-06-qa-review
    blocks: []
    description: "QA reviewer must explicitly PASS the findings register before advancing to report generation"
    required_approvers: [qa-reviewer]

# ─── References ─────────────────────────────────────────────────────────────────

knowledge_base:
  ot_ics_overview: "crew/knowledge-base/ot-ics-overview.md"
  nerc_cip_ref: "crew/knowledge-base/nerc-cip-reference.md"
  iec_62443_ref: "crew/knowledge-base/iec-62443-reference.md"
  nist_csf_ref: "crew/knowledge-base/nist-csf-reference.md"

data:
  severity_scales: "crew/data/severity-scales.yaml"
  standards_crosswalks: "crew/data/standards-crosswalks.yaml"

input_file_patterns:
  sow:
    description: "Statement of Work for scope validation"
    pattern: "{{engagement_artifacts}}/*-sow.md"
  data_request_responses:
    description: "Client-provided documentation from data request"
    pattern: "{{assessment_artifacts}}/client-data/**/*.{md,pdf,xlsx,docx}"
