code: crew
name: "CREW — Consulting Role Engine Workflows"
description: "AI-driven consulting workflow framework for cybersecurity and technology consulting engagements. Ships with an OT/ICS cybersecurity starter pack."
default_selected: false

# Variables inherited from Core module (if BMAD core is installed):
## user_name
## communication_language
## document_output_language
## output_folder

firm_name:
  prompt: "What is your consulting firm or practice name?"
  default: "Your Firm Name"
  result: "{value}"

engagement_name:
  prompt: "What is the client engagement name or identifier?"
  default: "{directory_name}"
  result: "{value}"

client_name:
  prompt: "What is the client organization name?"
  default: "Client"
  result: "{value}"

vertical:
  prompt: "Which consulting vertical is this engagement?"
  default: "ot-ics"
  result: "{value}"
  single-select:
  - value: "ot-ics"
    label: "OT/ICS Cybersecurity - Operational Technology & Industrial Control Systems"
  - value: "cloud-security"
    label: "Cloud Security - AWS, Azure, GCP security assessments"
  - value: "it-audit"
    label: "IT Audit - Controls testing and audit support"
  - value: "grc"
    label: "GRC - Governance, Risk & Compliance"
  - value: "pentest"
    label: "Penetration Testing - Adversarial security testing"

assessor_skill_level:
  prompt: "What is the primary assessor's experience level with this domain?"
  default: "intermediate"
  result: "{value}"
  single-select:
  - value: "junior"
    label: "Junior - Needs step-by-step guidance and detailed explanations"
  - value: "intermediate"
    label: "Intermediate - Familiar with domain, needs workflow structure"
  - value: "senior"
    label: "Senior - Domain expert, needs minimal guidance"

engagement_artifacts:
  prompt: "Where should engagement artifacts (SOW, project plan, comms) be stored?"
  default: "{output_folder}/engagement"
  result: "{project-root}/{value}"

assessment_artifacts:
  prompt: "Where should assessment artifacts (findings, evidence, notes) be stored?"
  default: "{output_folder}/assessment"
  result: "{project-root}/{value}"

deliverables:
  prompt: "Where should client deliverables (reports, roadmaps, presentations) be stored?"
  default: "{output_folder}/deliverables"
  result: "{project-root}/{value}"

# Directories to create during installation
directories:
- "{engagement_artifacts}"
- "{assessment_artifacts}"
- "{deliverables}"
