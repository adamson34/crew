# CREW Standards Crosswalks
# Used by: Priya Kapoor (Compliance)
# Purpose: Map security control domains across NERC CIP, IEC 62443, NIST CSF, and NIST SP 800-82

# Cross-reference table structure:
# control_domain: Human-readable control area
# nerc_cip: Applicable NERC CIP standard(s) with requirement number
# iec_62443: Applicable IEC 62443 section(s)
# nist_csf: NIST CSF 2.0 function/category
# nist_800_82: NIST SP 800-82 Rev 3 section
# notes: Important nuances or applicability conditions

standards_crosswalks:

  asset_identification:
    control_domain: "Asset Identification and Inventory"
    description: "Identification, classification, and documentation of OT/ICS assets"
    nerc_cip:
      - standard: "CIP-002-5.1a"
        requirement: "R1, R2, R3"
        description: "BES Cyber System categorization and documentation"
    iec_62443:
      - section: "IEC 62443-2-1 §4.2.3.4"
        description: "Asset inventory as part of CSMS"
      - section: "IEC 62443-3-2 §5.4.1"
        description: "Zone and conduit identification"
    nist_csf:
      - function: "IDENTIFY"
        category: "ID.AM"
        subcategory: "ID.AM-1, ID.AM-2"
        description: "Physical and software asset inventories"
    nist_800_82:
      - section: "6.2.1"
        description: "Inventory management for ICS"
    notes: "NERC CIP applies only to registered entities with BES Cyber Systems. IEC 62443 applies to all industrial sectors."

  network_segmentation:
    control_domain: "Network Segmentation and Architecture"
    description: "Zone separation, boundary controls, and traffic management between OT and IT networks"
    nerc_cip:
      - standard: "CIP-005-7"
        requirement: "R1"
        description: "Electronic Security Perimeter definition and management"
      - standard: "CIP-005-7"
        requirement: "R2"
        description: "Remote access management for ESPs"
    iec_62443:
      - section: "IEC 62443-3-3 SR 5.1"
        description: "Network segmentation"
      - section: "IEC 62443-3-3 SR 5.2"
        description: "Zone boundary protection"
      - section: "IEC 62443-3-2 §5.4"
        description: "Zone and conduit model implementation"
    nist_csf:
      - function: "PROTECT"
        category: "PR.AC"
        subcategory: "PR.AC-5"
        description: "Network integrity (network segregation)"
      - function: "PROTECT"
        category: "PR.PT"
        subcategory: "PR.PT-4"
        description: "Communications and control networks protected"
    nist_800_82:
      - section: "6.2.2"
        description: "Firewalls and network segmentation"
      - section: "6.3"
        description: "Defense-in-depth for ICS"
    notes: "DMZ implementation is specifically addressed in CIP-005-7 R2 for interactive remote access. IEC 62443 zone model is more comprehensive for non-BES environments."

  remote_access:
    control_domain: "Remote Access Management"
    description: "Authentication, authorization, and monitoring of remote access to OT environments"
    nerc_cip:
      - standard: "CIP-005-7"
        requirement: "R2"
        description: "Interactive Remote Access — encryption, authentication, monitoring"
      - standard: "CIP-007-6"
        requirement: "R5"
        description: "System access controls including authentication"
    iec_62443:
      - section: "IEC 62443-2-1 §4.3.3.6"
        description: "Remote access policy"
      - section: "IEC 62443-3-3 SR 1.3"
        description: "Authenticator management"
      - section: "IEC 62443-3-3 SR 2.5"
        description: "Session lock and termination"
    nist_csf:
      - function: "PROTECT"
        category: "PR.AC"
        subcategory: "PR.AC-3"
        description: "Remote access managed"
    nist_800_82:
      - section: "6.2.3"
        description: "Secure remote access for ICS"
    notes: "NERC CIP requires encryption and two-factor authentication for all interactive remote access to high and medium impact BES Cyber Systems."

  access_control:
    control_domain: "Access Control and Identity Management"
    description: "User account management, least privilege, privileged access controls"
    nerc_cip:
      - standard: "CIP-007-6"
        requirement: "R5"
        description: "System access controls — account management, authentication"
    iec_62443:
      - section: "IEC 62443-3-3 SR 1.1"
        description: "Human user identification and authentication"
      - section: "IEC 62443-3-3 SR 1.2"
        description: "Software process and device identification and authentication"
      - section: "IEC 62443-3-3 SR 2.1"
        description: "Authorization enforcement"
      - section: "IEC 62443-3-3 SR 2.2"
        description: "Wireless use control"
    nist_csf:
      - function: "PROTECT"
        category: "PR.AC"
        subcategory: "PR.AC-1, PR.AC-4, PR.AC-6, PR.AC-7"
        description: "Identities and credentials, access permissions, remote access, authentication"
    nist_800_82:
      - section: "6.2.4"
        description: "Access control for ICS"
    notes: "Privileged access management is a common gap in OT environments where shared accounts and default credentials persist from legacy system installations."

  patch_management:
    control_domain: "Patch and Vulnerability Management"
    description: "Processes for identifying, testing, and applying patches to OT/ICS systems"
    nerc_cip:
      - standard: "CIP-007-6"
        requirement: "R2"
        description: "Security patch management — 35-day patch cycle for applicable systems"
    iec_62443:
      - section: "IEC 62443-2-1 §4.3.4.3"
        description: "Patch management process"
      - section: "IEC 62443-2-3"
        description: "Patch management in the IACS environment (full standard)"
    nist_csf:
      - function: "PROTECT"
        category: "PR.IP"
        subcategory: "PR.IP-12"
        description: "Vulnerability management plan developed and implemented"
      - function: "IDENTIFY"
        category: "ID.RA"
        subcategory: "ID.RA-1"
        description: "Asset vulnerabilities identified and documented"
    nist_800_82:
      - section: "6.2.5"
        description: "Patch management for ICS"
    notes: "NERC CIP 35-day patch cycle applies to High and Medium BES Cyber Systems. OT patch management is complicated by vendor support constraints, operational availability requirements, and legacy systems. Compensating controls must be documented when patching is not feasible."

  security_monitoring:
    control_domain: "Security Monitoring and Detection"
    description: "Event logging, monitoring, and detection capabilities in OT environments"
    nerc_cip:
      - standard: "CIP-007-6"
        requirement: "R4, R6"
        description: "R4: Security event monitoring; R6: System security management — log retention"
    iec_62443:
      - section: "IEC 62443-3-3 SR 6.1"
        description: "Audit log accessibility"
      - section: "IEC 62443-3-3 SR 6.2"
        description: "Continuous monitoring"
    nist_csf:
      - function: "DETECT"
        category: "DE.AE"
        subcategory: "DE.AE-1, DE.AE-2, DE.AE-3"
        description: "Anomalies and events detection"
      - function: "DETECT"
        category: "DE.CM"
        subcategory: "DE.CM-1, DE.CM-7"
        description: "Continuous monitoring"
    nist_800_82:
      - section: "6.2.7"
        description: "Monitoring and incident detection"
    notes: "Traditional SIEM platforms may not parse OT protocols (Modbus, DNP3, EtherNet/IP). OT-specific monitoring tools (Claroty, Dragos, Nozomi Networks) are designed for passive OT network monitoring."

  incident_response:
    control_domain: "Incident Response"
    description: "Preparation, detection, response, and recovery for cybersecurity incidents in OT environments"
    nerc_cip:
      - standard: "CIP-008-6"
        requirement: "R1, R2, R3"
        description: "Incident reporting and response planning"
    iec_62443:
      - section: "IEC 62443-2-1 §4.3.6"
        description: "Incident planning and response"
    nist_csf:
      - function: "RESPOND"
        category: "RS.RP, RS.CO, RS.AN, RS.MI, RS.IM"
        description: "Response planning, communications, analysis, mitigation, improvements"
      - function: "RECOVER"
        category: "RC.RP, RC.IM, RC.CO"
        description: "Recovery planning, improvements, communications"
    nist_800_82:
      - section: "6.2.8"
        description: "Incident response for ICS"
    notes: "NERC CIP CIP-008 requires documented incident response plans for BES Cyber System incidents and annual exercises. OT incident response plans must address operational continuity considerations not present in IT IR plans."

  configuration_management:
    control_domain: "Configuration and Change Management"
    description: "Baseline configurations, change control, and configuration monitoring"
    nerc_cip:
      - standard: "CIP-010-4"
        requirement: "R1, R2, R3"
        description: "Configuration change management and vulnerability assessments"
    iec_62443:
      - section: "IEC 62443-2-1 §4.3.4.2"
        description: "Configuration management"
    nist_csf:
      - function: "PROTECT"
        category: "PR.IP"
        subcategory: "PR.IP-1, PR.IP-3"
        description: "Baseline configurations; configuration change control"
    nist_800_82:
      - section: "6.2.6"
        description: "Configuration management for ICS"
    notes: "NERC CIP CIP-010 requires documented baselines and change management processes for BES Cyber Systems. In OT environments, unauthorized configuration changes can have direct operational and safety impacts."

  physical_security:
    control_domain: "Physical Security"
    description: "Physical access controls to OT/ICS assets, control rooms, and field equipment"
    nerc_cip:
      - standard: "CIP-006-6"
        requirement: "R1, R2, R3"
        description: "Physical security — PSP definition, access management, visitor control"
    iec_62443:
      - section: "IEC 62443-2-1 §4.3.3.7"
        description: "Physical security controls"
    nist_csf:
      - function: "PROTECT"
        category: "PR.AC"
        subcategory: "PR.AC-2"
        description: "Physical access managed"
    nist_800_82:
      - section: "6.2.9"
        description: "Physical security for ICS"
    notes: "NERC CIP CIP-006 defines Physical Security Perimeters (PSPs) for High and Medium BES Cyber Systems. Physical security gaps in OT environments include unmonitored remote field sites, unlocked control cabinets, and inadequate visitor management."

  supply_chain:
    control_domain: "Supply Chain and Third-Party Risk"
    description: "Vendor security, software integrity, and third-party access management"
    nerc_cip:
      - standard: "CIP-013-2"
        requirement: "R1, R2, R3"
        description: "Supply chain risk management for BES Cyber Systems"
    iec_62443:
      - section: "IEC 62443-2-4"
        description: "Security requirements for IACS service providers (full standard)"
      - section: "IEC 62443-2-1 §4.3.3.8"
        description: "Third-party access management"
    nist_csf:
      - function: "IDENTIFY"
        category: "ID.SC"
        subcategory: "ID.SC-1 through ID.SC-5"
        description: "Supply chain risk management"
    nist_800_82:
      - section: "6.2.10"
        description: "Supply chain risk management for ICS"
    notes: "NERC CIP CIP-013 is relatively recent (2020 enforcement) and a common compliance gap. IEC 62443-2-4 defines security requirements for OT service providers and integrators."

  security_governance:
    control_domain: "Security Governance and Policy"
    description: "OT security policies, roles, responsibilities, and security management system"
    nerc_cip:
      - standard: "CIP-003-9"
        requirement: "R1, R2"
        description: "Security management controls — policies and low impact BES Cyber System requirements"
    iec_62443:
      - section: "IEC 62443-2-1"
        description: "Establishing an Industrial Automation and Control System Security Management System (CSMS) — full standard"
    nist_csf:
      - function: "GOVERN"
        category: "GV.OC, GV.RM, GV.RR, GV.PO, GV.OV, GV.SC"
        description: "Organizational context, risk management, roles, policies, oversight, supply chain (CSF 2.0)"
      - function: "IDENTIFY"
        category: "ID.GV"
        description: "Governance (CSF 1.1)"
    nist_800_82:
      - section: "4"
        description: "Security program management for ICS"
    notes: "IEC 62443-2-1 is the most comprehensive governance framework for OT environments. It defines the Cybersecurity Management System (CSMS) for asset owners. NIST CSF 2.0 added the GOVERN function to address organizational context and risk management at the program level."

# Framework version reference
framework_versions:
  nerc_cip:
    current: "CIP-002-5.1a through CIP-014-3 (various versions)"
    effective: "2024"
    note: "NERC CIP standards are versioned individually; check current effective versions at nerc.com"
  iec_62443:
    current:
      - "IEC 62443-1-1:2009 (Concepts and models)"
      - "IEC 62443-2-1:2010 (CSMS requirements)"
      - "IEC 62443-2-3:2015 (Patch management)"
      - "IEC 62443-2-4:2015+A1:2017 (Service provider requirements)"
      - "IEC 62443-3-2:2020 (Security risk assessment)"
      - "IEC 62443-3-3:2013 (System security requirements and SLs)"
      - "IEC 62443-4-1:2018 (Product development)"
      - "IEC 62443-4-2:2019 (Component requirements)"
    note: "Many parts are being revised; verify current editions before citing"
  nist_csf:
    current: "NIST CSF 2.0 (February 2024)"
    previous: "NIST CSF 1.1 (April 2018)"
    note: "CSF 2.0 added the GOVERN function. Many clients still reference CSF 1.1."
  nist_800_82:
    current: "NIST SP 800-82 Revision 3 (September 2023)"
    note: "Rev 3 significantly updated guidance; verify client is aware of current version"
